<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <!-- Initial values for the default ('dark') theme; App.tsx keeps both of
         these in sync with the active theme (src/utils/theme.ts) once it
         mounts. Declaring color-scheme up front stops mobile browsers' "auto
         dark theme" from re-tinting low-saturation colours (e.g. the
         fretboard-heatmap "unplayed" cells rendered near-white on Android)
         before the app's own theme attribute takes over. -->
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Fretboard Practice</title>
    <!-- Boot splash: painted from the very first byte (inline, before the app
         bundle) so there is never a blank #root while React and the audio
         samples warm up. The progress bar is a real milestone meter driven by
         src/main.tsx (service-worker check → newer build install → first data
         load); its width is set in JS, not animated on a fixed timer. There is
         no hard time cap — the splash stays until that work genuinely finishes
         (min 1.6s so it never flashes). `.boot-splash__msg` carries a "still
         loading" note after a long wait, and on a load-blocking crash it shows
         the error plus the `.boot-splash__retry` reload button. Colours track
         the active theme's tokens (src/styles/00-tokens.css): --bg-0 → --bg-1
         gradient, --accent bar. The inline boot script below sets `data-theme`
         from `pref_theme`/`pref_season` before first paint, so these `var()`s
         resolve to the user's palette; the fallbacks are the winter-dark
         values, matched for a config-less / pre-token-CSS first frame. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: linear-gradient(
          180deg,
          var(--bg-0, var(--boot-splash-bg, #1a1a2e)) 0%,
          var(--bg-1, #111122) 100%
        );
        opacity: 1;
        transition: opacity 0.32s ease-out;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 46vw;
        max-width: 240px;
        height: auto;
        filter: drop-shadow(0 8px 26px rgba(0, 0, 0, 0.45));
        animation: boot-splash-mark 0.5s ease-out both;
      }
      #boot-splash .boot-splash__track {
        width: 46vw;
        max-width: 240px;
        height: 4px;
        border-radius: 999px;
        background: var(--surface-border, rgba(255, 255, 255, 0.08));
        overflow: hidden;
      }
      #boot-splash .boot-splash__bar {
        height: 100%;
        width: 6%;
        border-radius: inherit;
        background: var(--accent, #0ff);
        box-shadow: 0 0 10px rgba(var(--accent-rgb, 0, 255, 255), 0.55);
        /* No CSS transition: main.tsx eases the width itself every ~16ms and
           sounds a note as the bar's head crosses each step, so a transition
           on top would leave the bar trailing its own note glyphs. */
      }
      #boot-splash .boot-splash__pct {
        margin-top: -14px;
        color: rgba(var(--accent-rgb, 0, 255, 255), 0.85);
        font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.06em;
      }
      #boot-splash .boot-splash__msg {
        margin: 0;
        max-width: 74vw;
        color: var(--text-2, rgba(255, 255, 255, 0.62));
        font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      #boot-splash .boot-splash__retry {
        appearance: none;
        border: 1px solid rgba(var(--accent-rgb, 0, 255, 255), 0.5);
        background: transparent;
        color: var(--accent, #0ff);
        font: 500 14px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 10px 22px;
        border-radius: 999px;
        cursor: pointer;
      }
      #boot-splash .boot-splash__msg[hidden],
      #boot-splash .boot-splash__retry[hidden] { display: none !important; }
      /* Musical-note glyphs spawned by src/main.tsx at the progress fill edge:
         each rises, drifts sideways (`--drift`), spins a touch (`--spin`) and
         fades as it climbs (`--rise`). */
      #boot-splash .boot-splash__note {
        position: fixed;
        z-index: 1;
        margin: 0;
        line-height: 1;
        color: rgba(var(--accent-rgb, 0, 255, 255), 0.92);
        text-shadow: 0 0 10px rgba(var(--accent-rgb, 0, 255, 255), 0.55);
        pointer-events: none;
        transform: translate(-50%, 0);
        will-change: transform, opacity;
        animation: boot-splash-note 1400ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      }
      @keyframes boot-splash-note {
        0% { opacity: 0; transform: translate(-50%, 0) scale(0.55) rotate(0deg); }
        14% { opacity: 1; }
        65% { opacity: 0.5; }
        100% {
          opacity: 0;
          transform:
            translate(calc(-50% + var(--drift, 0px)), calc(-1 * var(--rise, 80px)))
            scale(1.15) rotate(var(--spin, 0deg));
        }
      }
      @keyframes boot-splash-mark {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img { animation-duration: 0.01ms; }
        #boot-splash .boot-splash__note { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <img src="/splash-mark.png" alt="" />
      <div class="boot-splash__track"><div class="boot-splash__bar"></div></div>
      <span class="boot-splash__pct">0%</span>
      <p class="boot-splash__msg" role="status" hidden></p>
      <button class="boot-splash__retry" type="button" hidden></button>
    </div>
    <script>
      // Desktop/web only: emulate the mobile viewport by rendering the
      // app at a fixed phone size and uniformly scaling that frame to
      // fit the window. Below the mobile breakpoint this is a no-op -
      // the app fills the real screen exactly as before.
      (function () {
        var PHONE_W = 390;
        var PHONE_H = 844;
        var root = document.documentElement;
        // Set the left-handed flag before first paint so the fretboard and
        // chrome don't visibly flip after the app mounts.
        try {
          root.dataset.hand =
            JSON.parse(localStorage.getItem('pref_leftHanded') || 'false') === true
              ? 'left'
              : 'right';
        } catch (e) { root.dataset.hand = 'right'; }
        // Resolve the chosen theme before first paint so the boot splash (and
        // the app's first frame) render in the user's palette, not the
        // hardcoded winter-dark default. Mirrors src/hooks/useThemeEffect.ts;
        // THEME_BG must stay in sync with THEME_BG in src/utils/theme.ts.
        (function () {
          var MODES = { dark: 1, night: 1, day: 1 };
          var SEASONS = { winter: 1, spring: 1, summer: 1, autumn: 1 };
          var THEME_BG = {
            'winter-dark': '#1a1a2e', 'winter-night': '#0f1320', 'winter-day': '#eef2f8',
            'spring-dark': '#14201a', 'spring-night': '#12140d', 'spring-day': '#f1f7f0',
            'summer-dark': '#241009', 'summer-night': '#16110b', 'summer-day': '#fbf5df',
            'autumn-dark': '#201410', 'autumn-night': '#170e09', 'autumn-day': '#f4e8d3'
          };
          var mode = 'dark', season = 'winter';
          try {
            var m = JSON.parse(localStorage.getItem('pref_theme') || '""');
            if (MODES[m]) mode = m;
          } catch (e) {}
          try {
            var s = JSON.parse(localStorage.getItem('pref_season') || '""');
            if (SEASONS[s]) season = s;
          } catch (e) {}
          var attr = season + '-' + mode;
          root.dataset.theme = attr;
          var bg = THEME_BG[attr] || THEME_BG['winter-dark'];
          root.style.setProperty('--boot-splash-bg', bg);
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', bg);
          var colorScheme = document.querySelector('meta[name="color-scheme"]');
          if (colorScheme) colorScheme.setAttribute('content', mode === 'day' ? 'light' : 'dark');
        })();
        root.style.setProperty('--phone-w', PHONE_W + 'px');
        root.style.setProperty('--phone-h', PHONE_H + 'px');
        function updateScale() {
          if (window.innerWidth < 601) {
            root.style.setProperty('--phone-scale', 1);
            return;
          }
          var scale = Math.min(
            1,
            (window.innerWidth - 24) / PHONE_W,
            (window.innerHeight - 24) / PHONE_H
          );
          root.style.setProperty('--phone-scale', scale);
        }
        updateScale();
        window.addEventListener('resize', updateScale);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
