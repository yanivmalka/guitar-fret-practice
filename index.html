<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <!-- Initial values for the default ('dark') theme; App.tsx keeps both of
         these in sync with the active theme (src/utils/theme.ts) once it
         mounts. Declaring color-scheme up front stops mobile browsers' "auto
         dark theme" from re-tinting low-saturation colours (e.g. the
         fretboard-heatmap "unplayed" cells rendered near-white on Android)
         before the app's own theme attribute takes over. -->
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Fretboard Practice</title>
    <!-- Boot splash: painted from the very first byte (inline, before the app
         bundle) so there is never a blank #root while React and the audio
         samples warm up. The progress bar is a fixed ~1.6s CSS animation — a
         reassurance cue, not a real load meter; src/main.tsx fades the whole
         layer out once the app has mounted. Colours track the hamburger-drawer
         palette: --bg-0 → --bg-1 gradient, cyan --accent bar. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        background: linear-gradient(180deg, #1a1a2e 0%, #111122 100%);
        opacity: 1;
        transition: opacity 0.32s ease-out;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 46vw;
        max-width: 240px;
        height: auto;
        filter: drop-shadow(0 8px 26px rgba(0, 0, 0, 0.45));
        animation: boot-splash-mark 0.5s ease-out both;
      }
      #boot-splash .boot-splash__track {
        width: 46vw;
        max-width: 240px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #boot-splash .boot-splash__bar {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: #0ff;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.55);
        animation: boot-splash-fill 1.6s ease-out forwards;
      }
      @keyframes boot-splash-mark {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes boot-splash-fill {
        from { width: 0; }
        to { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img,
        #boot-splash .boot-splash__bar { animation-duration: 0.01ms; }
        #boot-splash .boot-splash__bar { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <img src="/splash-mark.png" alt="" />
      <div class="boot-splash__track"><div class="boot-splash__bar"></div></div>
    </div>
    <script>
      // Desktop/web only: emulate the mobile viewport by rendering the
      // app at a fixed phone size and uniformly scaling that frame to
      // fit the window. Below the mobile breakpoint this is a no-op -
      // the app fills the real screen exactly as before.
      (function () {
        var PHONE_W = 390;
        var PHONE_H = 844;
        var root = document.documentElement;
        root.style.setProperty('--phone-w', PHONE_W + 'px');
        root.style.setProperty('--phone-h', PHONE_H + 'px');
        function updateScale() {
          if (window.innerWidth < 601) {
            root.style.setProperty('--phone-scale', 1);
            return;
          }
          var scale = Math.min(
            1,
            (window.innerWidth - 24) / PHONE_W,
            (window.innerHeight - 24) / PHONE_H
          );
          root.style.setProperty('--phone-scale', scale);
        }
        updateScale();
        window.addEventListener('resize', updateScale);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
