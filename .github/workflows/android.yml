name: Build Android APK

# Manual trigger only: run it from the Actions tab with "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm install

      - run: npm run build
        env:
          # Relative asset base so the WebView (served from https://localhost/)
          # can load the bundle. Without this the app is a black screen.
          CAP_BUILD: '1'
          # Same variables as the Pages deploy. Without them the app runs in
          # guest-only mode (no "Sign in with Google").
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # android/ is gitignored and generated, so recreate it in the runner.
      - run: npx cap add android
      - run: npx cap sync android

      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
