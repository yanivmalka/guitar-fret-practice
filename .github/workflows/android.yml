name: Build Android APK

# Manual trigger only: run it from the Actions tab with "Run workflow".
on:
  workflow_dispatch:

# 'write' so the first run can commit the generated debug keystore back.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # A stable signing key so every APK is signed identically and new builds
      # install over the old app (data kept) instead of being rejected for a
      # signature mismatch. The first run generates it and commits it back;
      # later runs reuse the committed file. A debug keystore has a well-known
      # password ("android") and is safe to keep in the repo.
      - name: Ensure a stable debug keystore
        run: |
          if [ ! -f android-overrides/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android-overrides/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f android-overrides/debug.keystore
            git commit -m "Add a stable debug keystore so APK updates install in place"
            git push
          fi

      - run: npm install

      - run: npm run build
        env:
          # Relative asset base so the WebView (served from https://localhost/)
          # can load the bundle. Without this the app is a black screen.
          CAP_BUILD: '1'
          # Same variables as the Pages deploy. Without them the app runs in
          # guest-only mode (no "Sign in with Google").
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # android/ is gitignored and generated, so recreate it in the runner.
      - run: npx cap add android
      # Generate launcher icons (adaptive + legacy, all densities) and the
      # native splash drawables into the fresh android/ project from the
      # committed source art in assets/ (produced by `npm run gen:icons`).
      - run: npx capacitor-assets generate --android
      # Swap in the immersive full-screen MainActivity (hides both system bars).
      - run: cp android-overrides/MainActivity.java android/app/src/main/java/com/guitarfretpractice/app/MainActivity.java
      # Swap in the manifest with the OAuth-callback deep-link intent-filter.
      - run: cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      # Monotonic versionCode so Android always treats a new APK as an update.
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android

      # Gradle's default debug signingConfig reads ~/.android/debug.keystore
      # with password "android" / alias "androiddebugkey" — the same values the
      # keystore above was created with — so overwriting that file is all it
      # takes to sign every build with our stable key.
      - run: mkdir -p ~/.android && cp android-overrides/debug.keystore ~/.android/debug.keystore

      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
